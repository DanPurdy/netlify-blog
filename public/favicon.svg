<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The header brand in miniature: dp on the midnight ground, p in the
       accent pink. Self-coloured, so it reads on any browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#0C1626"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="Figtree, Figtree Variable, Arial, sans-serif"
        font-weight="800" font-size="38" letter-spacing="-1">
    <tspan fill="#E4EBF6">d</tspan><tspan fill="#FF3D93">p</tspan>
  </text>
</svg>
