# pnpm 11 reads settings from here rather than the "pnpm" field in package.json.
# Both packages have postinstall steps we genuinely need: sharp powers Astro's
# image optimisation, esbuild ships a platform-specific binary.
allowBuilds:
  esbuild: true
  sharp: true

# Force the patched sharp for its Dependabot high (GHSA, fixed in 0.35).
# image-size and extract-zip, which had highs with no published fix, left the
# tree with @astrojs/netlify 8.2.7, so they need no override.
overrides:
  sharp: '>=0.35.0'
